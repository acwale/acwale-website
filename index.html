<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AC Service Booking</title>
</head>
<body>

<h1>AC Service Booking Form</h1>

<form>
  <input type="text" placeholder="Customer Name"><br><br>

  <input type="tel" placeholder="Mobile Number"><br><br>

  <input type="tel" placeholder="WhatsApp Number"><br><br>

  <input type="text" placeholder="Address"><br><br>

  <input type="text" placeholder="Google Map Location"><br><br>

  <input type="text" placeholder="AC Brand"><br><br>

  <select>
    <option>Service</option>
    <option>Repair</option>
    <option>Installation</option>
    <option>Gas Filling</option>
  </select>

  <br><br>

  <textarea placeholder="Complaint Details"></textarea>

  <br><br>

  <button type="submit">Book Service</button>

</form>

</body>
</html>
